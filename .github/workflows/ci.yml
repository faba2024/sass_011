name: CI

on:
  push:
    branches:
      - fix/server-components-runtime
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_example_key_1234567890
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_example_key_1234567890
      NEXT_PUBLIC_APP_URL: https://example.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
